name: Patikros

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Lint, tipai ir testai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipų patikra
        run: npm run typecheck
      - name: Testai
        run: npm test -- --ci
